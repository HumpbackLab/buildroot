image recovery.vfat {
	empty = true

	vfat {
		label = "RECOVERY"
	}

	size = 32M
}

image powerfin-sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition recovery {
		partition-type = 0x0e
		image = "recovery.vfat"
		offset = 1M
		size = 32M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
